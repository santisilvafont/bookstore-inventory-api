server {
    listen 8080;
    root /usr/share/nginx/html;

    # Built files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is a client-side route (e.g. /books/3): serve the app and let the
    # router handle it. index.html is never cached, so a new release is picked up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
